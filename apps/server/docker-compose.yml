services:
  backend:
    build: .
    container_name: eduquestBackend

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USER: sa
      DB_PASS: ${DB_PASS}
      DB_NAME:  eduquest-db
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    volumes:
      - .:/app
      - /app/node_modules

    command: sh -c "npm ci && npm run start:dev"

    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eduquest-dbase
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASS}
    ports:
      - "1433:1433"
    healthcheck:
      # ponytail: creates the local database without a third initialization container.
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID(N''eduquest-db'') IS NULL CREATE DATABASE [eduquest-db]; SELECT 1" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
